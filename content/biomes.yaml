# Node weights per biome, before region / phase / party / facility modifiers.
biomes:
  - id: plains
    name: Plains
    node_weights: { battle: 2, event: 3, gather_food: 2, gather_herbs: 1, rest: 1, cache: 1, traveler: 1, shrine: 0.5 }
    phase_modifiers:
      night: { battle: 2, traveler: 0.2 }
    enemies: [road_bandit]
    gather: { food: [2, 4], herbs: [1, 2] }
  - id: forest
    name: Forest
    node_weights: { battle: 3, event: 2, gather_wood: 3, gather_herbs: 2, rest: 1, cache: 1, shrine: 0.5 }
    phase_modifiers:
      evening: { battle: 1.5 }
      night: { battle: 2.5, gather_wood: 0.5 }
    enemies: [hollow_wolf, road_bandit]
    gather: { wood: [2, 5], herbs: [1, 3] }
  - id: hills
    name: Hills
    node_weights: { battle: 2, event: 2, gather_ore: 3, rest: 1, cache: 1.5, shrine: 1 }
    enemies: [road_bandit]
    gather: { ore: [1, 3], stone: [2, 4] }
  - id: marsh
    name: Marsh
    node_weights: { battle: 3, event: 2, gather_herbs: 3, rest: 0.5, cache: 1 }
    enemies: [hollow_wolf]
    gather: { herbs: [2, 4] }
  - id: corrupted
    name: Corrupted Frontier
    node_weights: { battle: 4, elite: 1, event: 2, rest: 0.5, cache: 1, shrine: 1 }
    phase_modifiers:
      night: { battle: 2, elite: 2 }
    enemies: [hollow_wolf]
    gather: { ore: [1, 2] }
