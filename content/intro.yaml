# The prologue, shown page by page before character creation (Enter turns the page, Esc skips).
# Amanda's text, lightly polished.
pages:
  - "In the beginning there was nothing, until Aluma, the Deity of Light, and Duskus, the Deity of Darkness, joined their powers and made the universe. There was much love between them, and from it came a host of lesser deities who helped shape the region of Duluma."
  - "At first there was harmony. But Aluma and Duskus were opposites, and opposites quarrel; their falling-out is what we know as day and night. In time humans appeared in Duluma. Fascinated by these creatures, both deities took human form and went down among them, and from those visits came a scattering of half-deities, some more divine than others, who make their home in Duluma still."
  - "You were thought to be full-blooded. But when you came of age it was plain that no domain had come to you by birthright, as it never does for most half-deities, and you were cast down to Duluma to live among the mortals. Which is where you find yourself today."
