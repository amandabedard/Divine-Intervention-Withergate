# Fired by the trigger zone on the landing glade: the tutorial fight.
- narrate: "[PLACEHOLDER: A wolf steps out of the treeline. There is nothing behind its eyes.]"
- battle:
    enemy: hollow_wolf
    on_win:
      - narrate: "[PLACEHOLDER: It falls. Something in your chest hums, briefly, like a struck bell.]"
      - effects: { flags: { first_fight_won: true }, domain_points: { combat: 1 } }
      - effects: { start_cutscene: the_messenger }
    on_lose:
      - narrate: "[PLACEHOLDER: It leaves you bleeding in the grass. Hooves, then, on the road.]"
      - effects: { flags: { first_fight_won: true, first_fight_lost: true }, hp: 5 }
      - effects: { start_cutscene: the_messenger }
