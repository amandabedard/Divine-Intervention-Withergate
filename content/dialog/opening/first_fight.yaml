# Fired by the trigger zone on the landing glade: the tutorial fight, against a thief.
- narrate: "[PLACEHOLDER: Someone has been watching from the treeline: a thief, knife out, who has decided that whatever fell out of the sky is worth robbing.]"
- battle:
    enemy: thief
    on_win:
      - narrate: "[PLACEHOLDER: The thief runs, or lies still; either way the glade is yours again. Something in your chest hums, briefly, like a struck bell.]"
      - effects: { flags: { first_fight_won: true }, domain_points: { combat: 1 } }
      - effects: { start_cutscene: the_proposal }
    on_lose:
      - narrate: "[PLACEHOLDER: The thief leaves you bleeding in the grass with lighter pockets. Then, hooves on the road.]"
      - effects: { flags: { first_fight_won: true, first_fight_lost: true }, hp: 5 }
      - effects: { start_cutscene: the_proposal }
