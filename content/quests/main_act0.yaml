# Act 0: the fall. Started by the opening cutscene on the landing glade; ends in Aboridge's throne room.
id: main_act0
title: "The Fall"
type: main
giver: none
summary: "[PLACEHOLDER: Cast out of the heavens, you land in a glade at the edge of Duluma, a region at war with itself and with something worse.]"
stages:
  - id: forage
    objective: "Gather something to eat from the glade."
    complete_when: { any: [{ resource_min: { herbs: 1 } }, { resource_min: { wood: 21 } }] }
  - id: fight
    objective: "Something is watching from the eastern treeline."
    complete_when: { flags: [first_fight_won] }
  - id: proposal
    objective: "Hear the knight out."
    complete_when: { flags: [proposal_heard] }
  - id: arrive
    objective: "Follow Aldric to Withergate."
    complete_when: { flags: [tour_done] }
  - id: talk
    objective: "Aldric is waiting in your quarters."
    complete_when: { flags: [aldric_quarters_talk] }
  - id: aboridge
    objective: "Travel to Aboridge with Aldric and meet the king."
    complete_when: { map: aboridge }
  - id: castle
    objective: "Walk up through Aboridge to the castle."
    complete_when: { flags: [king_audience] }
  - id: choose
    objective: "Get to know Jasper and Gemma, then recruit one of them."
    complete_when: { residents_min: 1 }
    # The king's word follows as soon as the conversation closes.
    on_complete: { start_cutscene: the_kings_thanks }
  - id: thanks
    objective: "Hear the king out."
    complete_when: { flags: [king_thanks] }
rewards: { faith: 5, xp: 20, quest_start: main_act1 }
journal_notes:
  arrive: "[PLACEHOLDER: Withergate. Four buildings and a great deal of horizon.]"
  aboridge: "[PLACEHOLDER: Two days east. Aldric says the king does not like to be kept waiting.]"
  castle: "[PLACEHOLDER: Lower Aboridge keeps the poor in; Upper Aboridge keeps everyone else out. The castle sits above both.]"
  choose: "[PLACEHOLDER: The king can spare one of them. Jasper, out of his prison and into his mines; Gemma, in from the country with an axe.]"
