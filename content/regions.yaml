# SAMPLE regions. A route runs between two towns over `days` segments; a wild region is
# explored for 1–3 segments. Each segment is three nodes and a checkpoint drawn from the
# pool listed for it (the last checkpoint of a route is the town's gates).
regions:
  - id: east_road_route
    name: The East Road
    description: "[PLACEHOLDER: the road from Withergate to Aboridge.]"
    kind: route
    from: withergate
    to: aboridge
    days: 2
    biomes: [plains, forest]
    danger: 1
    checkpoints:
      - pool: [wayfarer_camp]
      - pool: [aboridge_gates]
  - id: frontier
    name: The Frontier
    description: "[PLACEHOLDER: the land that borders the corruption.]"
    kind: wild
    from: withergate
    segments: [1, 3]
    biomes: [hills, corrupted]
    danger: 3
    checkpoints:
      - pool: [hollow_den]
